<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Stupidity Ink</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .login-box p {
            text-align: center;
            color: var(--accent);
            margin-bottom: 30px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--text);
            color: var(--page-bg);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,255,255,0.15);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--accent);
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--text);
        }

        .logo-login {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-login img {
            height: 60px;
            width: auto;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-login">
                <img src="images/WhatsApp Image 2025-11-10 at 9.11.43 PM.jpeg" alt="Stupidity Ink Logo">
            </div>
            <h1>Admin Login</h1>
            <p>Sign in to manage gallery</p>
            
            <button class="login-btn" onclick="netlifyIdentity.open()">Sign In with Netlify</button>

            <a href="index.html" class="back-link">← Back to Website</a>
        </div>
    </div>

    <script>
        // Check if already logged in
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (user) {
                    // Already logged in, redirect to admin
                    window.location.href = "/admin/";
                }
            });
            window.netlifyIdentity.on("login", () => {
                window.location.href = "/admin/";
            });
        }
    </script>
</body>
</html>
