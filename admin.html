<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Stupidity Ink</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            min-height: 100vh;
            padding: 100px 20px 40px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .admin-header h1 {
            font-size: 2rem;
        }

        .admin-header .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-header .user-info span {
            color: var(--accent);
        }

        .logout-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 77, 77, 0.2);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }

        .upload-section {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 30px;
            height: fit-content;
        }

        .upload-section h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.02);
        }

        .upload-area.drag-over {
            border-color: var(--text);
            background: rgba(255,255,255,0.05);
        }

        .upload-area p {
            color: var(--accent);
            margin-bottom: 10px;
        }

        .upload-area .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        #fileInput {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .upload-btn {
            width: 100%;
            padding: 14px;
            background: var(--text);
            color: var(--page-bg);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,255,255,0.15);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .gallery-management {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 30px;
        }

        .gallery-management h2 {
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .gallery-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .gallery-item-admin {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
        }

        .gallery-item-admin img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item-admin .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
            background: rgba(255, 77, 77, 0.9);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item-admin:hover .delete-btn {
            opacity: 1;
        }

        .success-message {
            background: rgba(77, 255, 77, 0.1);
            border: 1px solid rgba(77, 255, 77, 0.3);
            color: #6bff6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .error-message {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--accent);
        }

        .empty-gallery {
            text-align: center;
            padding: 40px;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <div class="logo">
                <img src="images/WhatsApp Image 2025-11-10 at 9.11.43 PM.jpeg" alt="Stupidity Ink Logo">
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">View Site</a></li>
                    <li><a href="#" class="active">Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="admin-container container">
        <div class="admin-header">
            <h1>Admin Dashboard</h1>
            <div class="user-info">
                <span>Welcome, <strong id="adminUsername">Admin</strong></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="admin-grid">
            <div class="upload-section">
                <h2>Upload New Image</h2>
                
                <div class="success-message" id="successMessage">
                    Image uploaded successfully!
                </div>
                
                <div class="error-message" id="errorMessage">
                    Error uploading image
                </div>

                <form id="uploadForm">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📷</div>
                        <p>Drag & drop an image here</p>
                        <p>or click to select</p>
                        <input type="file" id="fileInput" accept="image/*">
                    </div>
                    
                    <img id="previewImage" class="preview-image" alt="Preview">

                    <div class="form-group">
                        <label for="imageAlt">Image Description (Alt Text)</label>
                        <input type="text" id="imageAlt" name="imageAlt" placeholder="e.g., Custom Dragon Tattoo by Stupidity Ink" required>
                    </div>

                    <button type="submit" class="upload-btn" id="uploadBtn">Upload Image</button>
                </form>
            </div>

            <div class="gallery-management">
                <h2>Manage Gallery</h2>
                <div class="gallery-list" id="galleryList">
                    <div class="loading">Loading images...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Base URL - Change this if your server is at a different location
        const API_URL = 'server';

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            // Set username
            const username = localStorage.getItem('adminUser');
            document.getElementById('adminUsername').textContent = username || 'Admin';
            
            // Load gallery images
            loadGalleryImages();
        });

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = 'login.html';
        }

        // File upload handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');

        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length) {
                fileInput.files = files;
                showPreview(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                showPreview(e.target.files[0]);
            }
        });

        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        // Upload form submission
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            const imageAlt = document.getElementById('imageAlt').value;
            const uploadBtn = document.getElementById('uploadBtn');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            if (!fileInput.files.length) {
                errorMessage.textContent = 'Please select an image';
                errorMessage.style.display = 'block';
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';
            
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            formData.append('alt', imageAlt);
            
            try {
                const token = localStorage.getItem('adminToken');
                const response = await fetch(`${API_URL}/upload.php`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    
                    // Reset form
                    document.getElementById('uploadForm').reset();
                    previewImage.style.display = 'none';
                    
                    // Reload gallery
                    loadGalleryImages();
                    
                    setTimeout(() => {
                        successMessage.style.display = 'none';
                    }, 3000);
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                errorMessage.textContent = error.message || 'Error uploading image';
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload Image';
            }
        });

        // Load gallery images
        async function loadGalleryImages() {
            const galleryList = document.getElementById('galleryList');
            
            try {
                const response = await fetch(`${API_URL}/images.php`);
                const data = await response.json();
                
                if (data.success && data.images.length > 0) {
                    galleryList.innerHTML = data.images.map(img => `
                        <div class="gallery-item-admin">
                            <img src="${img.filepath}" alt="${img.alt}">
                            <button class="delete-btn" onclick="deleteImage(${img.id})" title="Delete">×</button>
                        </div>
                    `).join('');
                } else {
                    galleryList.innerHTML = '<div class="empty-gallery">No images uploaded yet</div>';
                }
            } catch (error) {
                galleryList.innerHTML = '<div class="error-message" style="display:block;">Failed to load images. Make sure XAMPP/PHP server is running.</div>';
                console.error('Error loading images:', error);
            }
        }

        // Delete image
        async function deleteImage(id) {
            if (!confirm('Are you sure you want to delete this image?')) return;
            
            try {
                const token = localStorage.getItem('adminToken');
                const response = await fetch(`${API_URL}/images.php?id=${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                
                if (data.success) {
                    loadGalleryImages();
                } else {
                    alert('Failed to delete image');
                }
            } catch (error) {
                alert('Error deleting image');
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
